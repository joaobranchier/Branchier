name: Deploy to GitHub Pages

on:
  push:
    # The repository started empty, so this branch is currently the default.
    # Both are listed so the deploy keeps working after a merge to main.
    branches:
      - main
      - claude/ios-siren-controller-simulator-t20ima
  # Pages has to be switched on by hand once (see the deploy job below for why
  # that cannot be automated). This daily run means that whenever that happens,
  # the site publishes itself within a day without anyone pushing again.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # The tones are a claim about frequencies, so measure them before shipping.
      - run: npm test
      # And drive the real faceplate in a real browser: every check in this
      # suite is a defect that reading the code did not catch.
      - run: npx playwright install --with-deps chromium
      - name: Serve and run the browser suite
        # One step: a background server started in its own step is not
        # guaranteed to still be running in the next one.
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/index.html >/dev/null && break
            sleep 1
          done
          npm run test:ui

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must be switched on once for the repository, under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      #
      # configure-pages can create the site itself with `enablement: true`,
      # but that call needs the `administration` scope, and `administration`
      # is not one of the scopes a workflow may request for GITHUB_TOKEN.
      # Asking for it makes the workflow file invalid and the run dies before
      # any job starts. Doing it any other way would mean a personal access
      # token with admin rights sitting in the repository, which is a far
      # worse thing to own than one visit to a settings page.
      #
      # So this step is allowed to fail: the tests above are the real gate,
      # and a red cross every day on a repository whose owner is waiting to
      # flip one switch is noise, not information. The summary below says
      # plainly what happened either way.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Report that Pages is not switched on yet
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "### Publicação pendente"
            echo
            echo "Os testes passaram, mas o GitHub Pages ainda não está ligado"
            echo "para este repositório, então não há onde publicar."
            echo
            echo "Para ligar, uma vez só:"
            echo
            echo "**Settings → Pages → Build and deployment → Source → GitHub Actions**"
            echo
            echo "Depois disso não é preciso fazer mais nada: este workflow roda"
            echo "de novo todo dia e publica sozinho assim que encontrar o Pages"
            echo "ligado."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: .

      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Report the published address
        if: steps.deployment.outcome == 'success'
        run: |
          {
            echo "### Publicado"
            echo
            echo "${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
