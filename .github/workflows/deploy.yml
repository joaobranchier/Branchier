name: Deploy to GitHub Pages

on:
  push:
    # The repository started empty, so this branch is currently the default.
    # Both are listed so the deploy keeps working after a merge to main.
    branches:
      - main
      - claude/ios-siren-controller-simulator-t20ima
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # The tones are a claim about frequencies, so measure them before shipping.
      - run: npm test
      # And drive the real faceplate in a real browser: every check in this
      # suite is a defect that reading the code did not catch.
      - run: npx playwright install --with-deps chromium
      - name: Serve and run the browser suite
        # One step: a background server started in its own step is not
        # guaranteed to still be running in the next one.
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/index.html >/dev/null && break
            sleep 1
          done
          npm run test:ui

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository on the first run, so publishing
          # needs no visit to the settings page. The repository is public, so
          # this serves content that is already public at a URL.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
